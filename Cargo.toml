[package]
name = "e-cli"
version = "0.6.0"
authors = ["Saniee"]
repository = "https://git.saniee.dev/Saniee/e-cli"
edition = "2024"

[dependencies]
rayon = "^1.11.0"
tracing-subscriber = {version = "^0.3.20", features = ["json", "env-filter"]}
tracing = "^0.1.41"
clap = { version = "^4.5.51", features = ["derive"] }
serde = { version = "^1.0.200", features = ["derive"] }
serde_json = "^1.0.145"
toml = "^0.8"
reqwest = { version = "^0.12.24", features = ["blocking", "json"] }
indicatif = "^0.17"
ratatui = "^0.29"
crossterm = "^0.28"

[dev-dependencies]
tempfile = "^3"
